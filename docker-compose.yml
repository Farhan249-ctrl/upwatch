name: upwatch-stack

services:
  mongo:
    image: mongo:7.0
    container_name: upwatch-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-upwatch_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-upwatch}
    volumes:
      - upwatch_mongo_data:/data/db
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api:
    image: farhan14031/upwatch-api:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upwatch-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose environment overrides .env's host-dev 127.0.0.1:27018
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-upwatch_admin}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGO_DB:-upwatch}?authSource=admin
      # demo only: lets the worker monitor SlotLock on the host
      ALLOW_PRIVATE_TARGETS: "true"
      API_PORT: ${API_PORT:-4000}
    command: ["node", "src/index.js"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - edge
      - private
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${API_PORT:-4000}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  worker:
    image: farhan14031/upwatch-worker:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upwatch-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose environment overrides .env's host-dev 127.0.0.1:27018
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-upwatch_admin}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGO_DB:-upwatch}?authSource=admin
      # demo only: lets the worker monitor SlotLock on the host
      ALLOW_PRIVATE_TARGETS: "true"
      WORKER_HEARTBEAT_FILE: ${WORKER_HEARTBEAT_FILE:-/tmp/worker-heartbeat}
      WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    command: ["node", "src/worker/index.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "src/worker/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    image: farhan14031/upwatch-frontend:v1
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upwatch-frontend
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    container_name: upwatch-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8082}:80"
      - "${NGINX_HTTPS_PORT:-8444}:443"
    environment:
      NGINX_ENVSUBST_FILTER: "^(API_PORT|NGINX_HTTPS_PORT)$"
      NGINX_HTTPS_PORT: "${NGINX_HTTPS_PORT:-8444}"
      API_PORT: "${API_PORT:-4000}"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  upwatch_mongo_data:

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
